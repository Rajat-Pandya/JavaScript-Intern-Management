<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            var theme = null;
            try {
                var saved = JSON.parse(localStorage.getItem('itpms_theme'));
                if (saved === 'dark' || saved === 'light') theme = saved;
            } catch (error) {}
            if (!theme) {
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = prefersDark ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Attendance Tracking - Intern Training &amp; Performance Management System">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <title>Attendance | Intern Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="interns.html">Interns</a>
        <a href="attendance.html" class="active">Attendance</a>
        <a href="assessment.html">Assessment</a>
        <a href="tasks.html">Tasks</a>
        <a href="performance.html">Performance</a>
    </nav>

    <main class="container">
        <section class="card">
            <h2>Record Attendance</h2>
            <form id="attendance-form" novalidate>
                <div class="form-grid">
                    <label>Intern
                        <select name="internId" id="attendance-intern"></select>
                        <span class="error" data-error-for="internId"></span>
                    </label>

                    <label>Date
                        <input name="date" type="date">
                        <span class="error" data-error-for="date"></span>
                    </label>

                    <label>Status
                        <select name="status" id="attendance-status"></select>
                        <span class="error" data-error-for="status"></span>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Attendance</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Attendance Summary</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Working Days</th>
                            <th>Present</th>
                            <th>Half Day</th>
                            <th>Absent</th>
                            <th>Leave</th>
                            <th>Attendance %</th>
                            <th>Category</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="history-dialog">
        <div id="history-content"></div>
        <form method="dialog"><button class="btn">Close</button></form>
    </dialog>

    <div id="toast-container"></div>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/attendance.js"></script>
</body>

</html>
